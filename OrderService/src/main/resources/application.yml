server:
  port: 8080

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:orderdb}
    username: ${POSTGRES_USER:orderuser}
    password: ${POSTGRES_PASSWORD:orderpass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  liquibase:
    enabled: true
    change-log: classpath:changelog/db.changelog-master.yaml

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/autosalon}

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${SPRING_KAFKA_CONSUMER_GROUP_ID:order-service}
      auto-offset-reset: ${SPRING_KAFKA_AUTO_OFFSET_RESET:earliest}
    listener:
      auto-startup: true
      concurrency: ${SPRING_KAFKA_LISTENER_CONCURRENCY:1}

grpc:
  client:
    storage:
      host: ${GRPC_STORAGE_HOST:localhost}
      port: ${GRPC_STORAGE_PORT:9090}
      timeout-ms: ${GRPC_STORAGE_TIMEOUT_MS:3000}
      health-timeout-ms: ${GRPC_STORAGE_HEALTH_TIMEOUT_MS:1000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    url: /v3/api-docs


logging:
  level:
    ru.arslanova.orderservice: INFO
    org.apache.kafka: WARN
    org.springframework.kafka: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [traceId=%X{traceId:-},orderId=%X{orderId:-}] %logger{36} - %msg%n"

app:
  outbox:
    max-attempts: 5
  kafka:
    producer:
      max-block-ms: ${APP_KAFKA_PRODUCER_MAX_BLOCK_MS:5000}
    topics:
      auto-create: ${APP_KAFKA_TOPICS_AUTO_CREATE:true}
    retry:
      attempts: ${APP_KAFKA_RETRY_ATTEMPTS:2}
      interval-ms: ${APP_KAFKA_RETRY_INTERVAL_MS:3000}
