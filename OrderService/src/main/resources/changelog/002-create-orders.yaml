databaseChangeLog:
  - changeSet:
      id: 002-create-orders
      author: arslanova
      changes:
        - createTable:
            tableName: orders
            columns:
              - column: { name: id,            type: UUID, constraints: { primaryKey: true, nullable: false } }
              - column: { name: client_id,     type: UUID, constraints: { nullable: false } }
              - column: { name: manager_id,    type: UUID }
              - column: { name: car_model_id,  type: UUID }
              - column: { name: type,          type: VARCHAR(32), constraints: { nullable: false } }
              - column: { name: status,        type: VARCHAR(32), constraints: { nullable: false } }
              - column: { name: created_at,     type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }
              - column: { name: updated_at,     type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }
              - column: { name: removed,       type: boolean, defaultValueBoolean: false, constraints: { nullable: false } }

  - changeSet:
      id: 002-create-order-components
      author: arslanova
      changes:
        - createTable:
            tableName: order_components
            columns:
              - column:
                  name: order_id
                  type: UUID
                  constraints: { nullable: false, foreignKeyName: fk_order_components_order, references: orders(id) }
              - column: { name: component_type, type: VARCHAR(64), constraints: { nullable: false } }
              - column: { name: part_id,        type: UUID,        constraints: { nullable: false } }
        - addPrimaryKey:
            tableName: order_components
            columnNames: order_id, component_type
