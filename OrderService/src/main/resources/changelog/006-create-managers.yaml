databaseChangeLog:
  - changeSet:
      id: 006-create-managers
      author: arslanova
      changes:
        - createTable:
            tableName: managers
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints: { primaryKey: true, nullable: false }
              - column: { name: full_name,  type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: username,   type: VARCHAR(255), constraints: { nullable: false, unique: true } }
              - column: { name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }
              - column: { name: updated_at, type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }
              - column: { name: removed,    type: boolean, defaultValueBoolean: false, constraints: { nullable: false } }

  - changeSet:
      id: 006-seed-managers
      author: arslanova
      changes:
        - insert:
            tableName: managers
            columns:
              - column: { name: id,         value: "00000000-0000-4000-a000-000000000002" }
              - column: { name: full_name,  value: "Manager Autosalon" }
              - column: { name: username,   value: "manager" }
              - column: { name: created_at, valueComputed: "CURRENT_TIMESTAMP" }
              - column: { name: updated_at, valueComputed: "CURRENT_TIMESTAMP" }
              - column: { name: removed,    valueBoolean: false }
        - insert:
            tableName: managers
            columns:
              - column: { name: id,         value: "00000000-0000-4000-a000-000000000005" }
              - column: { name: full_name,  value: "Petr Petrov" }
              - column: { name: username,   value: "manager2" }
              - column: { name: created_at, valueComputed: "CURRENT_TIMESTAMP" }
              - column: { name: updated_at, valueComputed: "CURRENT_TIMESTAMP" }
              - column: { name: removed,    valueBoolean: false }
        - insert:
            tableName: managers
            columns:
              - column: { name: id,         value: "00000000-0000-4000-a000-000000000006" }
              - column: { name: full_name,  value: "Anna Smirnova" }
              - column: { name: username,   value: "manager3" }
              - column: { name: created_at, valueComputed: "CURRENT_TIMESTAMP" }
              - column: { name: updated_at, valueComputed: "CURRENT_TIMESTAMP" }
              - column: { name: removed,    valueBoolean: false }
