databaseChangeLog:
  - changeSet:
      id: 004-create-car-model-components
      author: arslanova
      changes:
        - createTable:
            tableName: car_model_components
            columns:
              - column:
                  name: car_model_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_car_model_components_car
                    references: car_models(id)
              - column: { name: component_type, type: VARCHAR(64), constraints: { nullable: false } }
              - column: { name: part_id,        type: UUID,        constraints: { nullable: false } }
        - addPrimaryKey:
            tableName: car_model_components
            columnNames: car_model_id, component_type
