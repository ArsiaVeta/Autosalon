databaseChangeLog:
  - changeSet:
      id: 003-create-assembly-orders
      author: arslanova
      changes:
        - createTable:
            tableName: assembly_orders
            columns:
              - column: { name: id,                type: UUID, constraints: { primaryKey: true, nullable: false } }
              - column: { name: source_order_id,   type: UUID, constraints: { nullable: false } }
              - column: { name: state,             type: VARCHAR(32), constraints: { nullable: false } }
              - column: { name: created_at,         type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }
              - column: { name: updated_at,         type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }
              - column: { name: removed,           type: boolean, defaultValueBoolean: false, constraints: { nullable: false } }

  - changeSet:
      id: 003-create-processed-messages
      author: arslanova
      changes:
        - createTable:
            tableName: processed_messages
            columns:
              - column: { name: event_id,     type: UUID, constraints: { primaryKey: true, nullable: false } }
              - column: { name: processed_at, type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }
